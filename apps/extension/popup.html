<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Helix</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #0f172a;
        --fg-dim: #64748b;
        --border: #e2e8f0;
        --bg: #ffffff;
        --accent: #06b6d4;
        --good: #10b981;
        --warn: #f59e0b;
        --bad: #ef4444;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f1f5f9;
          --fg-dim: #94a3b8;
          --border: #334155;
          --bg: #0f172a;
        }
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 340px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      .h {
        padding: 14px 16px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
      }
      .h .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }
      .h .logo .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent);
      }
      .h .actions button {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--fg-dim);
        padding: 3px 8px;
        font-size: 11px;
        border-radius: 4px;
        cursor: pointer;
      }
      .h .actions button:hover { color: var(--fg); }
      section {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }
      section:last-child { border-bottom: none; }
      .label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--fg-dim);
        margin-bottom: 4px;
      }
      .big {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .big .tok {
        font-size: 15px;
        color: var(--fg-dim);
        font-variant-numeric: tabular-nums;
      }
      .big .cost {
        font-size: 22px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      table {
        width: 100%;
        margin-top: 8px;
        border-collapse: collapse;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      table td {
        padding: 3px 0;
      }
      table td.model  { color: var(--fg); }
      table td.tokens { color: var(--fg-dim); text-align: right; padding-right: 10px; }
      table td.cost   { color: var(--fg); text-align: right; }
      .empty {
        text-align: center;
        padding: 30px 16px;
        color: var(--fg-dim);
        font-size: 12px;
      }
      .empty strong { display: block; color: var(--fg); margin-bottom: 6px; font-weight: 500; }
      .footer {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: var(--fg-dim);
        padding: 8px 16px;
      }
      .footer code {
        background: var(--border);
        padding: 1px 4px;
        border-radius: 3px;
      }
      .warn {
        color: var(--warn);
        font-size: 11px;
        margin-left: 4px;
      }
      .note {
        font-size: 10px;
        color: var(--fg-dim);
        margin-top: 6px;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="h">
      <div class="logo">
        <span class="dot"></span>
        <span>Helix</span>
      </div>
      <div class="actions">
        <button id="reset" title="Clear all stored events">Reset</button>
      </div>
    </div>
    <div id="root"></div>
    <div class="footer">
      <span>Local-only • ~97% approx</span>
      <span>v0.1</span>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
